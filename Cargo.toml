[workspace]
resolver = "2"
members = [
    "crates/chronos-mtc-core",
    "crates/chronos-pqc-sys",
    "crates/chronos-quic-fec",
    "crates/chronos-ebpf-guard",
    "crates/chronos-sim",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["PrathamKapoor <prathamkapoor027@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/PrathamKapoor/chronos-mtc"

[workspace.dependencies]
sha2 = "0.10"
sha3 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
bytes = "1.7"
crc32fast = "1.4"
reed-solomon-simd = "3.0"
rand = "0.8"
rand_core = "0.6"
rand_chacha = "0.3"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
